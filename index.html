<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="路線踏査">
<title>路線踏査アプリ・車線記録</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;background:#fff}
header{padding:7px;max-height:57dvh;overflow:auto;background:#f4f5f6}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:5px}
button,input{font:inherit}
button{min-height:38px;padding:5px 9px;border:1px solid #a8adb4;border-radius:6px;background:#fff;color:#17202a;font-size:13px;touch-action:manipulation}
button:disabled{opacity:.42}
button[aria-pressed="true"]{background:#145d9e;color:#fff;border-color:#145d9e}
#start,#finish,#checkpoint{color:#fff;border:0}
#start{background:#237842}
#finish{background:#b82525}
#checkpoint{background:#006b70}
#counts,#lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;width:100%;max-width:430px}
#counts>strong,#lanes>strong{grid-column:1/-1}
#counts>button,#lanes>button{width:100%;min-width:0;min-height:44px;padding:5px 2px;white-space:nowrap}
#roadStatus{font-size:17px;font-weight:750}
#message,#gpsStatus,#saveStatus{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
#message{color:#29354a}
#gpsStatus{color:#985300}
#saveStatus{color:#006b70}
#map{flex:1;min-height:0}
#follow{position:fixed;right:10px;bottom:25px;z-index:1000;border-radius:20px}
.route-label{background:#fff;border:2px solid;border-radius:999px;text-align:center;font-size:12px;font-weight:750;line-height:24px}
.dot{width:17px;height:17px;border:3px solid #fff;border-radius:50%;background:#dc2626;box-shadow:0 0 0 2px #dc262688}
#panel{position:fixed;inset:auto 0 0;height:47%;z-index:1100;background:#fff;border-top:2px solid #145d9e;padding:6px;display:flex;flex-direction:column}
#tableArea{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #d2d5d8;padding:4px;white-space:nowrap}
th{position:sticky;top:0;background:#eef0f3}
dialog{width:min(94vw,540px);max-height:85dvh;overflow:auto;border:0;border-radius:10px;padding:15px}
dialog h2{font-size:18px;margin:0 0 8px}
dialog::backdrop{background:#0008}
#historyChoices{max-height:40dvh;overflow:auto;border-block:1px solid #ddd;margin:8px 0}
#historyChoices label{display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #eee}
#historyChoices input{width:18px;height:18px;flex:none}
#pat{width:100%;font-size:16px;margin:6px 0}
#downloads a{font-size:13px;padding:5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="header">
  <div class="row">
    <button id="start" disabled>調査開始</button>
    <button id="finish" disabled>調査終了</button>
    <button id="checkpoint" disabled>途中保存</button>
    <button id="list">経路一覧</button>
  </div>
  <div class="row" id="counts" role="group" aria-label="車線数">
    <strong>車線数</strong>
    <button data-mode="oneway" aria-pressed="false">片道</button>
    <button data-mode="1" aria-pressed="true">1車線</button>
    <button data-mode="2" aria-pressed="false">2車線</button>
    <button data-mode="3" aria-pressed="false">3車線</button>
    <button data-mode="4" aria-pressed="false">4車線</button>
  </div>
  <div class="row" id="lanes" role="group" aria-label="通過車線番号">
    <strong>車線No.</strong>
    <button data-lane="1" aria-pressed="false">1</button>
    <button data-lane="2" aria-pressed="false" disabled>2</button>
    <button data-lane="3" aria-pressed="false" disabled>3</button>
    <button data-lane="4" aria-pressed="false" disabled>4</button>
  </div>
  <div id="roadStatus" aria-live="polite">路線を読み込み中…</div>
  <div id="gpsStatus"></div>
  <div id="saveStatus" aria-live="polite"></div>
  <div id="message" aria-live="polite"></div>
  <div class="row">
    <button id="construction" disabled>工事 開始</button>
    <button id="detour" disabled>迂回 開始</button>
    <button id="history" disabled>色塗りの引き継ぎ</button>
    <button id="tokenSettings">トークン入力</button>
  </div>
  <div class="row" id="recovery" hidden>
    <button id="resume">前回の調査を再開</button>
    <button id="discard">途中記録を破棄</button>
  </div>
  <div class="row" id="downloads"></div>
</header>

<div id="map"></div>
<button id="follow" aria-pressed="false">現在地追従：OFF</button>

<section id="panel" hidden aria-label="経路一覧">
  <div class="row">
    <span id="summary"></span>
    <button id="exportList">経路一覧Excel</button>
    <button id="closeList">閉じる</button>
  </div>
  <div id="tableArea"></div>
</section>

<dialog id="historyDialog">
  <h2>前回までの車線の色塗りを引き継ぎますか？</h2>
  <p>表示したい調査にチェックを付けてください。過去の経路・時刻は引き継ぎません。</p>
  <div id="historyChoices"></div>
  <div class="row">
    <button id="applyHistory">選んだ色塗りを引き継ぐ</button>
    <button id="fresh">引き継がない</button>
  </div>
</dialog>

<dialog id="reasonDialog">
  <form method="dialog">
    <h2>迂回の理由</h2>
    <button value="路駐">路駐</button>
    <button value="工事">工事</button>
    <button value="">キャンセル</button>
  </form>
</dialog>

<dialog id="tokenDialog">
  <form method="dialog">
    <h2>GitHubトークン</h2>
    <label for="pat">対象リポジトリに書き込めるトークン</label>
    <input id="pat" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p>入力したトークンは再読み込みするまで、このページのメモリ内だけに保持します。</p>
    <button value="set">このページで使う</button>
    <button value="clear">消去</button>
    <button value="">キャンセル</button>
  </form>
</dialog>

<script>
'use strict';

const OWNER='poncho19900731', REPO='tyuubu_new', BRANCH='main', FOLDER='results';
const UNIT=50, NEAR=15, MAX_ACCURACY=25, MAX_GAP=15000;
const ROUTE_MARGIN=5, DIR_MOVE=3, DIR_STREAK=2, DIR_DISTANCE=8;
const MAX_JUMP=150, MAX_SPEED=45, LANE_WIDTH=3.1, LABEL_INTERVAL=1000;
const COLORS=['#227b40','#365bd8','#b63783','#c2610b','#6d43bb','#00838c','#89521f','#546b16'];
const ZONES={
  construction:{name:'工事',color:'#875944',kml:'ff445987'},
  detour:{name:'迂回',color:'#e88b19',kml:'ff198be8'}
};
const $=id=>document.getElementById(id);
const msg=text=>{$('message').textContent=text;};
const ll=p=>[p[1],p[0]];
const units={units:'meters'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
}[c]));
const pad=n=>String(n).padStart(2,'0');
function stamp(ms){
  const d=new Date(ms);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
const when=ms=>ms?new Date(ms).toLocaleString('ja-JP'):'';
const modeName=m=>m==='oneway'?'片道':`片側${m||'1'}車線`;
const dirName=d=>d==='F'?'往路':d==='R'?'復路':d==='O'?'片道':'方向判定中';

const routes=[],routeById=new Map(),inherited=new Map(),painted=new Map();
let history=[],selected=new Set(),recovered=null,pending=null,volatileResult=null;
// 起動時は片側1車線。車線No.は手動で選ぶまで未選択。
let mode='1',lane=0,job=null,activeZone=null,latest=null,previous=null,dirState=null;
let watchId=null,watchEpoch=0,wake=null,follow=false,marker=null,accuracyCircle=null;
let ready=false,busy=false,dirty=false,token='',settingsVersion=0;
let trackLine=null,downloadURLs=[],activePaths={};

const map=L.map('map',{preferCanvas:true}).setView([24.78,125.33],11);
for(const [name,z] of Object.entries({roads:410,tracks:420,lanes:440,zones:455,labels:500,position:560})){
  map.createPane(name).style.zIndex=z;
}
const tile=(type,ext='png')=>L.tileLayer(
  `https://cyberjapandata.gsi.go.jp/xyz/${type}/{z}/{x}/{y}.${ext}`,
  {attribution:'地理院タイル',maxNativeZoom:18,maxZoom:22}
);
const bases={'淡色地図':tile('pale'),'標準地図':tile('std'),'航空写真':tile('seamlessphoto','jpg')};
bases['淡色地図'].addTo(map);
L.control.layers(bases).addTo(map);
const laneLayer=L.layerGroup().addTo(map),tracks=L.layerGroup().addTo(map);
const zones=L.layerGroup().addTo(map),currentLane=L.layerGroup().addTo(map);
if(window.ResizeObserver) new ResizeObserver(()=>map.invalidateSize()).observe($('header'));

// 直前版と同じ保存領域を使用する。
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(`road-lanes-v1-${OWNER}-${REPO}`,1);
    r.onupgradeneeded=()=>{
      r.result.createObjectStore('meta');
      r.result.createObjectStore('surveys',{keyPath:'id'});
    };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.onblocked=()=>reject(new Error('別の画面で保存領域を使用しています'));
  });
}
let db,writes=Promise.resolve();
function dbRead(store,key){
  return new Promise((resolve,reject)=>{
    const s=db.transaction(store).objectStore(store);
    const r=key===undefined?s.getAll():s.get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
function dbWrite(stores,fn){
  const task=writes.then(()=>new Promise((resolve,reject)=>{
    const tx=db.transaction(stores,'readwrite');
    tx.oncomplete=resolve;
    tx.onabort=()=>reject(tx.error||new Error('端末保存に失敗しました'));
    try{fn(tx);}catch(e){tx.abort();reject(e);}
  }));
  writes=task.catch(()=>{});
  return task;
}

async function text(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return (await r.text()).replace(/^\uFEFF/,'');
}
function parseKml(source,file){
  const xml=new DOMParser().parseFromString(source,'application/xml');
  if(xml.querySelector('parsererror')) throw new Error('KMLの形式が不正です');
  const out=[];
  for(const placemark of xml.getElementsByTagNameNS('*','Placemark')){
    const name=[...placemark.children].find(n=>n.localName==='name')?.textContent||
      file.replace(/\.kml$/i,'');
    const route=name.normalize('NFKC').replace(/\(way\s*\d+\)/gi,'')
      .replace(/_\d+\s*$/,'').trim()||file;
    for(const line of placemark.getElementsByTagNameNS('*','LineString')){
      const raw=line.getElementsByTagNameNS('*','coordinates')[0]?.textContent.trim()||'';
      const c=raw.split(/\s+/).map(s=>s.split(',').slice(0,2).map(Number));
      if(c.length<2||c.some(p=>p.length<2||!p.every(Number.isFinite)||
        Math.abs(p[0])>180||Math.abs(p[1])>90)) continue;
      const clean=c.filter((p,i)=>!i||p[0]!==c[i-1][0]||p[1]!==c[i-1][1]);
      if(clean.length>=2) out.push({route,coords:clean});
    }
  }
  return out;
}
function geometryKey(route,coords){
  let a=2166136261,b=5381;
  const s=JSON.stringify([route,coords]);
  for(let i=0;i<s.length;i++){
    a=Math.imul(a^s.charCodeAt(i),16777619);
    b=Math.imul(b,33)^s.charCodeAt(i);
  }
  return (a>>>0).toString(36)+'-'+(b>>>0).toString(36);
}
function adjacency(a,b){
  const [x,y,X,Y]=a.box,[u,v,U,V]=b.box;
  const dy=30/111000,dx=dy/Math.max(.2,Math.cos((y+Y)/2*Math.PI/180));
  if(X+dx<u||U+dx<x||Y+dy<v||V+dy<y) return false;
  if(turf.lineIntersect(a.line,b.line).features.length) return true;
  return a.coords.some(p=>turf.pointToLineDistance(p,b.line,units)<=30)||
    b.coords.some(p=>turf.pointToLineDistance(p,a.line,units)<=30);
}
async function loadRoutes(){
  const files=JSON.parse(await text('list.json'));
  if(!Array.isArray(files)||!files.length) throw new Error('list.json にKML名がありません');
  const groups=new Map(),errors=[];
  for(const file of new Set(files)){
    try{
      if(typeof file!=='string'||!file.toLowerCase().endsWith('.kml')||
        file.split('/').some(x=>!x||x==='.'||x==='..'||x.includes('\\'))){
        throw new Error('KML名が不正です');
      }
      const parts=parseKml(await text('./'+file.split('/').map(encodeURIComponent).join('/')),file);
      if(!parts.length) throw new Error('LineStringがありません');
      for(const p of parts){
        const line=turf.lineString(p.coords),length=turf.length(line,units);
        const id=geometryKey(p.route,p.coords);
        if(!length||routeById.has(id)) continue;
        const r={...p,file,line,length,id,box:turf.bbox(line)};
        routes.push(r);routeById.set(id,r);
        if(!groups.has(r.route)) groups.set(r.route,[]);
        groups.get(r.route).push(r);
      }
    }catch(e){errors.push(`${file}：${e.message}`);}
  }
  if(!routes.length) throw new Error(`KMLの路線を読み込めません。\n${errors.join('\n')}`);
  const assigned=[],layers=[];
  for(const [name,parts] of groups){
    const used=new Set(assigned.filter(g=>parts.some(a=>g.parts.some(b=>adjacency(a,b))))
      .map(g=>g.color));
    let color=COLORS.find(c=>!used.has(c));
    for(let i=0;!color;i++){
      const c=`hsl(${(i*137.508)%360},72%,37%)`;
      if(!used.has(c)) color=c;
    }
    assigned.push({parts,color});
    const label=name.match(/(\d+(?:[-−]\d+)?)\s*号線/)?.[1]||
      name.match(/\d+/)?.[0]||name.slice(0,3);
    const candidates=[],placed=[];
    for(const r of parts){
      layers.push(L.polyline(r.coords.map(ll),{
        pane:'roads',color,weight:5,opacity:.65,interactive:false
      }).addTo(map));
      candidates.push({p:r.coords[0],end:true},{p:r.coords.at(-1),end:true});
      for(let d=LABEL_INTERVAL;d<r.length;d+=LABEL_INTERVAL){
        candidates.push({p:turf.along(r.line,d,units).geometry.coordinates,end:false});
      }
    }
    candidates.sort((a,b)=>Number(b.end)-Number(a.end));
    for(const {p} of candidates){
      if(placed.some(q=>turf.distance(p,q,units)<25)) continue;
      placed.push(p);
      const div=document.createElement('div');
      div.className='route-label';div.style.borderColor=color;div.textContent=label;
      L.marker(ll(p),{pane:'labels',interactive:false,icon:L.divIcon({
        className:'',html:div,iconSize:[29,28],iconAnchor:[14,14]
      })}).addTo(map);
    }
  }
  map.fitBounds(L.featureGroup(layers).getBounds(),{maxZoom:17});
  return errors;
}

const sectionKey=(r,i)=>`${r.id}:${i}`;
const laneKey=(dir,n)=>`${dir}${n}`;
function merged(key){
  const past=inherited.get(key),now=job?.sections[key];
  if(!now) return past;
  return {mode:now.mode,done:{...(past?.mode===now.mode?past.done:{}),...now.done}};
}
function sectionLine(r,i){
  const a=i*UNIT,b=Math.min((i+1)*UNIT,r.length);
  if(a>=b) return null;
  return turf.lineSliceAlong(r.line,a/1000,b/1000,{units:'kilometers'});
}
function laneOffsets(m,dir,n){
  if(m==='oneway') return [-LANE_WIDTH/2,LANE_WIDTH/2];
  // KML順が往路。各方向とも進行方向から見て左端がNo.1。
  const k=Number(m)-n;
  return dir==='F'?[k*LANE_WIDTH,(k+1)*LANE_WIDTH]:
    [-(k+1)*LANE_WIDTH,-k*LANE_WIDTH];
}
function lanePolygon(line,m,dir,n){
  const c=line.geometry.coordinates,[lo,hi]=laneOffsets(m,dir,n);
  function shift(offset){
    return c.map((p,i)=>{
      if(!offset) return p.slice(0,2);
      let a=c[Math.max(0,i-1)],b=c[Math.min(c.length-1,i+1)];
      if(a[0]===b[0]&&a[1]===b[1]){
        if(i+1<c.length){a=p;b=c[i+1];}
        else{a=c[i-1];b=p;}
      }
      const bearing=turf.bearing(a,b)+(offset>0?-90:90);
      return turf.destination(p,Math.abs(offset),bearing,units).geometry.coordinates;
    });
  }
  const ring=shift(lo).concat(shift(hi).reverse());
  ring.push(ring[0]);
  return ring;
}
function laneShapes(r,i,record,fn){
  const line=sectionLine(r,i);
  if(!line||!record?.mode) return;
  const dirs=record.mode==='oneway'?['O']:['F','R'];
  const count=record.mode==='oneway'?1:Number(record.mode);
  for(const d of dirs) for(let n=1;n<=count;n++){
    fn(lanePolygon(line,record.mode,d,n),!!record.done[laneKey(d,n)],d,n);
  }
}
function redrawSection(key){
  if(painted.has(key)){laneLayer.removeLayer(painted.get(key));painted.delete(key);}
  const [id,index]=key.split(':'),r=routeById.get(id),record=merged(key);
  if(!r||!record) return;
  const group=L.layerGroup();
  laneShapes(r,Number(index),record,(ring,done)=>{
    L.polygon(ring.map(ll),{
      pane:'lanes',color:'#171717',weight:1,fillColor:done?'#ffe129':'#fff',
      fillOpacity:1,interactive:false,smoothFactor:0
    }).addTo(group);
  });
  group.addTo(laneLayer);painted.set(key,group);
}
function redrawAll(){
  laneLayer.clearLayers();painted.clear();
  for(const key of new Set([...inherited.keys(),...Object.keys(job?.sections||{})])){
    redrawSection(key);
  }
}
function showCurrent(hit,dir){
  currentLane.clearLayers();
  if(!hit||!lane||!dir) return;
  const line=sectionLine(hit.r,hit.i);
  if(!line) return;
  L.polygon(lanePolygon(line,mode,dir,lane).map(ll),{
    pane:'lanes',color:'#1265d8',weight:2.5,fill:false,interactive:false,smoothFactor:0
  }).addTo(currentLane);
}
function rebuildHistory(){
  inherited.clear();
  // 同じ区間で車線数が異なる場合、選んだ中で新しい構成を表示する。
  for(const h of history.slice().sort((a,b)=>a.end-b.end)){
    if(!selected.has(h.id)) continue;
    for(const [key,rec] of Object.entries(h.sections||{})){
      if(!routeById.has(key.split(':')[0])) continue;
      const old=inherited.get(key);
      inherited.set(key,{mode:rec.mode,done:{...(old?.mode===rec.mode?old.done:{}),...rec.done}});
    }
  }
  redrawAll();
}
function historyDialog(){
  const box=$('historyChoices');box.replaceChildren();
  for(const h of history.slice().sort((a,b)=>b.end-a.end)){
    const label=document.createElement('label');
    const c=document.createElement('input'),span=document.createElement('span');
    c.type='checkbox';c.value=h.id;c.checked=selected.has(h.id);
    span.textContent=`${when(h.end)}｜${h.name||'路線踏査'}｜車線設定 ${Object.keys(h.sections||{}).length} 区間`;
    label.append(c,span);box.append(label);
  }
  if(!box.children.length) box.textContent='この端末に引き継げる色塗りはありません。';
  $('applyHistory').disabled=!history.length;
  $('historyDialog').showModal();
}
function chooseHistory(use){
  selected=new Set(use?[...$('historyChoices').querySelectorAll('input:checked')].map(c=>c.value):[]);
  rebuildHistory();$('historyDialog').close();updateControls();
  if(use){
    const stale=history.filter(h=>selected.has(h.id))
      .flatMap(h=>Object.keys(h.sections||{}))
      .filter(k=>!routeById.has(k.split(':')[0])).length;
    msg(`色塗りを ${selected.size} 件引き継ぎました。${stale?`\nKMLが変わった ${stale} 区間は表示しません。`:''}`);
  }else{
    msg('過去の色塗りを表示せず、新規調査を始められます。');
  }
}
$('applyHistory').onclick=()=>chooseHistory(true);
$('fresh').onclick=()=>chooseHistory(false);
$('historyDialog').addEventListener('cancel',e=>e.preventDefault());
$('history').onclick=historyDialog;

function updateControls(){
  $('start').disabled=!ready||!!job||!!recovered||busy||!!volatileResult;
  $('finish').disabled=!job||busy;
  $('checkpoint').disabled=!job||busy;
  $('history').disabled=!ready||!!job||busy;
  $('recovery').hidden=!recovered;
  $('resume').disabled=!ready||busy;
  $('discard').disabled=busy;
  for(const [type,z] of Object.entries(ZONES)){
    $(type).disabled=!job||busy||!!activeZone&&activeZone.type!==type;
    $(type).textContent=`${z.name} ${activeZone?.type===type?'終了':'開始'}`;
  }
  for(const b of $('counts').querySelectorAll('button')){
    b.disabled=!!recovered||busy;
    b.setAttribute('aria-pressed',String(b.dataset.mode===mode));
  }
  for(const b of $('lanes').querySelectorAll('button')){
    b.disabled=busy||!!recovered||mode==='oneway'||Number(b.dataset.lane)>Number(mode);
    b.setAttribute('aria-pressed',String(Number(b.dataset.lane)===lane));
  }
}
function resetMatch(){
  previous=null;dirState=null;latest=null;currentLane.clearLayers();
}
function inputChanged(){
  settingsVersion++;dirty=!!job;
  if(job){job.mode=mode;job.lane=lane;}
  resetMatch();
  $('roadStatus').textContent=job?
    `${modeName(mode)}｜${lane?`車線No.${lane}`:'車線未選択'}｜測位待ち`:'待機中';
  updateControls();
}
$('counts').onclick=e=>{
  const b=e.target.closest('[data-mode]');
  if(!b||b.disabled||mode===b.dataset.mode) return;
  mode=b.dataset.mode;lane=mode==='oneway'?1:0;inputChanged();
};
$('lanes').onclick=e=>{
  const b=e.target.closest('[data-lane]');
  if(!b||b.disabled) return;
  const n=Number(b.dataset.lane);lane=lane===n?0:n;inputChanged();
};
$('follow').onclick=()=>{
  follow=!follow;
  $('follow').setAttribute('aria-pressed',String(follow));
  $('follow').textContent=`現在地追従：${follow?'ON':'OFF'}`;
  if(follow&&marker) map.panTo(marker.getLatLng());
};

function locate(p){
  const dy=NEAR*1.5/111000,dx=dy/Math.max(.2,Math.cos(p[1]*Math.PI/180)),hits=[];
  for(const r of routes){
    const [x,y,X,Y]=r.box;
    if(p[0]<x-dx||p[0]>X+dx||p[1]<y-dy||p[1]>Y+dy) continue;
    const h=turf.nearestPointOnLine(r.line,p,units).properties;
    if(h.dist<=NEAR&&Number.isFinite(h.location)){
      const i=Math.max(0,Math.min(Math.ceil(r.length/UNIT)-1,Math.floor(h.location/UNIT)));
      hits.push({r,d:h.dist,at:h.location,i});
    }
  }
  hits.sort((a,b)=>a.d-b.d);
  if(!hits.length) return {kind:'outside',hit:null};
  if(hits[1]&&hits[1].d-hits[0].d<ROUTE_MARGIN) return {kind:'ambiguous',hit:null};
  return {kind:'ok',hit:hits[0]};
}
function createLayout(hit){
  const key=sectionKey(hit.r,hit.i);
  if(job.sections[key]?.mode===mode) return;
  job.sections[key]={mode,done:{}};
  dirty=true;redrawSection(key);
}
function markRange(hit,from,to,dir,at){
  const first=Math.max(0,Math.floor(Math.min(from,to)/UNIT));
  const last=Math.min(Math.ceil(hit.r.length/UNIT)-1,Math.floor(Math.max(from,to)/UNIT));
  for(let i=first;i<=last;i++){
    const overlap=Math.min(Math.max(from,to),(i+1)*UNIT,hit.r.length)-
      Math.max(Math.min(from,to),i*UNIT);
    if(overlap<=0) continue;
    const key=sectionKey(hit.r,i);
    if(job.sections[key]?.mode!==mode) job.sections[key]={mode,done:{}};
    const record=job.sections[key],k=laneKey(dir,lane);
    if(!record.done[k]){record.done[k]=at;dirty=true;redrawSection(key);}
  }
}
function matchDirection(hit,at){
  const old=previous;
  previous={...hit,time:at,setting:settingsVersion};
  if(!old||old.r.id!==hit.r.id||old.setting!==settingsVersion||
    at<=old.time||at-old.time>MAX_GAP){
    dirState=null;return {dir:mode==='oneway'?'O':'',from:null};
  }
  const delta=hit.at-old.at,abs=Math.abs(delta),seconds=(at-old.time)/1000;
  if(abs>MAX_JUMP||abs/seconds>MAX_SPEED){
    dirState=null;return {dir:mode==='oneway'?'O':'',from:null};
  }
  if(abs<DIR_MOVE){
    if(dirState&&at-dirState.lastMove>5000) dirState=null;
    return {dir:mode==='oneway'?'O':dirState?.confirmed||'',from:null};
  }
  if(mode==='oneway') return {dir:'O',from:old.at};
  const sign=delta>0?'F':'R';
  if(!dirState||dirState.sign!==sign){
    dirState={sign,steps:1,distance:abs,from:old.at,lastMove:at,confirmed:''};
  }else{
    dirState.steps++;dirState.distance+=abs;dirState.lastMove=at;
  }
  if(dirState.confirmed) return {dir:sign,from:old.at};
  if(dirState.steps>=DIR_STREAK&&dirState.distance>=DIR_DISTANCE){
    dirState.confirmed=sign;return {dir:sign,from:dirState.from};
  }
  return {dir:'',from:null};
}
function trackPoint(row){
  const last=job.points.at(-1);
  if(last&&row.time-last.time>MAX_GAP){trackLine=null;activePaths={};}
  if(trackLine&&last&&last.route===row.route&&last.dir===row.dir&&
    last.mode===row.mode&&last.lane===row.lane&&
    turf.distance(last.xy,row.xy,units)<2&&row.time-last.time<5000) return;
  if(!trackLine){
    job.paths.push([row.xy]);
    trackLine=L.polyline([ll(row.xy)],{
      pane:'tracks',color:'#40444b',weight:3,dashArray:'4 5',interactive:false
    }).addTo(tracks);
  }else{
    job.paths.at(-1).push(row.xy);trackLine.addLatLng(ll(row.xy));
  }
  job.points.push(row);dirty=true;
  if(activeZone){
    if(!activePaths[activeZone.type]){
      activePaths[activeZone.type]=[];activeZone.paths.push(activePaths[activeZone.type]);
    }
    activePaths[activeZone.type].push(row.xy);activeZone.last=row;
  }
  if(!$('panel').hidden) renderList();
}
function breakTrack(){
  resetMatch();trackLine=null;activePaths={};
}
function onPosition(pos){
  if(!job||busy||document.hidden) return;
  const {longitude,latitude,accuracy}=pos.coords,at=pos.timestamp;
  if(!Number.isFinite(at)||at<job.acceptAfter||job.lastFix&&at<=job.lastFix) return;
  const p=[longitude,latitude];
  if(!p.every(Number.isFinite)) return;
  if(job.lastFix&&at-job.lastFix>MAX_GAP) breakTrack();
  job.lastFix=at;
  if(!marker){
    marker=L.marker(ll(p),{pane:'position',interactive:false,icon:L.divIcon({
      className:'',html:'<div class="dot"></div>',iconSize:[17,17],iconAnchor:[8,8]
    })}).addTo(map);
    // 現在地マークに合わせてGPS精度円も赤色にする。
    accuracyCircle=L.circle(ll(p),{
      pane:'roads',radius:0,weight:1,color:'#dc2626',fillOpacity:.06,interactive:false
    }).addTo(map);
  }
  marker.setLatLng(ll(p));
  accuracyCircle.setLatLng(ll(p)).setRadius(Number.isFinite(accuracy)?accuracy:0);
  if(follow) map.panTo(ll(p),{animate:false});
  if(!Number.isFinite(accuracy)||accuracy>MAX_ACCURACY){
    breakTrack();
    $('gpsStatus').textContent='GPS精度が低いため、新たな色塗りを保留しています。';
    $('roadStatus').textContent='道路判定待ち';
    return;
  }
  $('gpsStatus').textContent='';
  const {kind,hit}=locate(p);
  let dir='';
  if(hit){
    const result=matchDirection(hit,at);dir=result.dir;
    createLayout(hit);
    if(dir&&lane&&result.from!==null) markRange(hit,result.from,hit.at,dir,at);
    showCurrent(hit,dir);
    $('roadStatus').textContent=`${hit.r.route}｜${dirName(dir)}｜${modeName(mode)}｜${lane?`車線No.${lane}`:'車線未選択'}`;
  }else{
    resetMatch();
    $('roadStatus').textContent=kind==='ambiguous'?'道路判定中：近接する候補が複数':'路線外';
  }
  latest={time:at,xy:p,acc:accuracy,route:hit?.r.route||
    (kind==='ambiguous'?'道路判定中':'路線外'),dir,mode,lane,section:hit?hit.i+1:''};
  trackPoint(latest);
}
function startGPS(){
  if(watchId!==null||!job) return;
  if(!window.isSecureContext||!navigator.geolocation){
    $('gpsStatus').textContent='位置情報を使うには、対応ブラウザでHTTPSのページを開いてください。';
    return;
  }
  const epoch=++watchEpoch;
  watchId=navigator.geolocation.watchPosition(
    p=>{if(epoch===watchEpoch) onPosition(p);},
    e=>{
      if(epoch!==watchEpoch) return;
      breakTrack();$('gpsStatus').textContent=`位置情報：${e.message}`;
    },
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
}
async function lockScreen(){
  if(!job||document.hidden||!navigator.wakeLock||wake&&!wake.released) return;
  const current=job;
  try{
    const obtained=await navigator.wakeLock.request('screen');
    if(job!==current||document.hidden||wake&&!wake.released) await obtained.release();
    else wake=obtained;
  }catch{}
}
function stopGPS(){
  watchEpoch++;
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null;
  if(wake){wake.release().catch(()=>{});wake=null;}
}

function drawZone(z){
  for(const p of z.paths){
    if(!p.length) continue;
    const style={pane:'zones',color:ZONES[z.type].color,weight:6};
    const shape=p.length===1?L.circleMarker(ll(p[0]),{...style,radius:5}):
      L.polyline(p.map(ll),style);
    const label=document.createElement('div');
    label.textContent=`${ZONES[z.type].name}${z.reason?`（${z.reason}）`:''}｜${when(z.start.time)} ～ ${when(z.last.time)}`;
    shape.bindPopup(label).addTo(zones);
  }
}
function finishZone(){

function openChoice(dialog){

async function toggleZone(type){

function saveDraft(manual=false){
  if(!job) return Promise.resolve(false);
  const current=job;
  let snapshot;
  try{snapshot=structuredClone({job,activeZone,selected:[...selected],saved:Date.now()});}
  catch(e){
    $('saveStatus').textContent='途中記録を準備できません。画面を閉じないでください。';
    return Promise.resolve(false);
  }
  dirty=false;
  return dbWrite(['meta'],tx=>tx.objectStore('meta').put(snapshot,'draft')).then(()=>{
    if(job===current) $('saveStatus').textContent=`${manual?'途中保存':'自動保存'}済み：${when(snapshot.saved)}`;
    return true;
  }).catch(e=>{
    if(job===current){
      dirty=true;
      $('saveStatus').textContent=`途中保存に失敗：${e.message}。画面を閉じないでください。`;
    }
    return false;
  });
}

const LOG_HEAD=['測位日時','路線','50m区間No.','方向','車線構成','通過車線No.','緯度','経度','GPS精度(m)'];
const logRow=p=>[
  when(p.time),p.route,p.section,p.dir?dirName(p.dir):'',p.mode?modeName(p.mode):'',p.lane||'',
  Number(p.xy[1].toFixed(7)),Number(p.xy[0].toFixed(7)),Math.round(p.acc)
];
const ZONE_HEAD=['種別','理由','開始時刻','終了時刻','開始緯度','開始経度','終了緯度','終了経度'];
const zoneRow=z=>[
  ZONES[z.type].name,z.reason,when(z.start.time),when(z.last.time),
  z.start.xy[1],z.start.xy[0],z.last.xy[1],z.last.xy[0]
];
function workbook(s){
  const wb=XLSX.utils.book_new();
  function add(name,rows){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);}
  add('調査概要',[['項目','内容'],['調査ID',s.id],['開始',when(s.start)],
    ['終了',when(s.end)],['測位記録数',s.points.length]]);
  add('経路一覧',[LOG_HEAD,...s.points.map(logRow)]);
  add('工事・迂回',[ZONE_HEAD,...s.zones.map(zoneRow)]);
  const rows=[['路線','元KML','50m区間No.','起点から(m)','終点まで(m)',
    '車線構成','方向','車線No.','今回の初回通過時刻']];
  for(const [key,record] of Object.entries(s.sections)){
    const [id,index]=key.split(':'),r=routeById.get(id),i=Number(index);
    for(const [k,time] of Object.entries(record.done)){
      rows.push([r?.route||id,r?.file||'',i+1,i*UNIT,
        r?Math.round(Math.min(r.length,(i+1)*UNIT)):'',
        modeName(record.mode),dirName(k[0]),Number(k.slice(1)),when(time)]);
    }
  }
  add('今回の車線踏査',rows);
  return wb;
}
function makeKml(s){
  const coords=p=>p.map(c=>`${c[0]},${c[1]},0`).join(' ');
  function path(name,p,color){
    if(!p.length) return '';
    const geom=p.length===1?`<Point><coordinates>${coords(p)}</coordinates></Point>`:
      `<LineString><tessellate>1</tessellate><coordinates>${coords(p)}</coordinates></LineString>`;
    return `<Placemark><name>${esc(name)}</name><Style><LineStyle><color>${color}</color><width>4</width></LineStyle></Style>${geom}</Placemark>`;
  }
  const records=[];
  for(const [key,rec] of Object.entries(s.sections)){
    const [id,index]=key.split(':'),r=routeById.get(id),i=Number(index);
    if(!r) continue;
    laneShapes(r,i,rec,(ring,done,d,n)=>{
      const name=`${r.route}｜区間${i+1}｜${dirName(d)}｜No.${n}｜${done?'今回踏査済み':'今回未踏査'}`;
      records.push(`<Placemark><name>${esc(name)}</name><styleUrl>#${done?'done':'white'}</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${coords(ring)}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`);
    });
  }
  return new Blob([
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>',
    `<name>${esc(s.id)} 路線踏査</name>`,
    '<Style id="done"><LineStyle><color>ff171717</color><width>1</width></LineStyle><PolyStyle><color>ff29e1ff</color></PolyStyle></Style>',
    '<Style id="white"><LineStyle><color>ff171717</color><width>1</width></LineStyle><PolyStyle><color>ffffffff</color></PolyStyle></Style>',
    '<Folder><name>今回の車線</name>',...records,'</Folder>',
    '<Folder><name>今回のGPS軌跡</name>',
    ...s.paths.map((p,i)=>path(`踏査軌跡 ${i+1}`,p,'ff333333')),'</Folder>',
    '<Folder><name>工事・迂回</name>',
    ...s.zones.flatMap(z=>z.paths.map(p=>path(
      `${ZONES[z.type].name}${z.reason?`（${z.reason}）`:''}`,p,ZONES[z.type].kml
    ))),'</Folder>','</Document></kml>'
  ],{type:'application/vnd.google-earth.kml+xml'});
}

function base64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function upload(file,credential){
  const path=[FOLDER,file.name].map(encodeURIComponent).join('/');
  const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const auth={Authorization:`Bearer ${credential}`};
  const headers={...auth,Accept:'application/vnd.github+json','Content-Type':'application/json'};
  const content=await base64(file.blob);
  const ref=`?ref=${encodeURIComponent(BRANCH)}`;
  const old=await fetch(url+ref,{headers,cache:'no-store'});
  if(old.ok){
    const meta=await old.json();
    if(meta.encoding==='base64'&&meta.content?.replace(/\s/g,'')===content) return;
    if(meta.size===file.blob.size){
      const raw=await fetch(url+ref,{
        headers:{...auth,Accept:'application/vnd.github.raw+json'},cache:'no-store'
      });
      if(raw.ok&&await base64(await raw.blob())===content) return;
    }
    throw new Error(`${file.name}：同名の異なるファイルがあるため上書きしません`);
  }
  if(old.status!==404) throw new Error(`GitHubで既存ファイルを確認できません：HTTP ${old.status}`);
  const r=await fetch(url,{method:'PUT',headers,body:JSON.stringify({
    message:`踏査記録：${file.name}`,branch:BRANCH,content
  })});
  if(!r.ok) throw new Error(`${file.name}：HTTP ${r.status}。対象リポジトリと書き込み権限を確認してください。`);
}
async function tokenDialog(){

  if(result==='set') token=$('pat').value.trim();

async function sendPending(){
  if(busy||!pending||pending.index>=pending.files.length) return;
  if(!token) await tokenDialog();
  if(!token||!pending||busy) return;
  const credential=token;
  busy=true;updateControls();
  try{
    const p=pending;
    while(p.index<p.files.length){
      msg(`GitHubへ保存中：${p.index+1}/${p.files.length}`);
      await upload(p.files[p.index],credential);
      const next=p.index+1;
      await dbWrite(['meta'],tx=>tx.objectStore('meta').put({...p,index:next},'pending'));
      p.index=next;
    }
    msg(`GitHubの ${FOLDER} に保存しました。`);
  }catch(e){
    msg(`GitHubへの保存を完了できませんでした。\n${e.message}\n端末保存は残っています。`);
  }finally{busy=false;updateControls();showDownloads();}
}
function showDownloads(){
  const box=$('downloads');box.replaceChildren();
  const old=downloadURLs;downloadURLs=[];
  setTimeout(()=>old.forEach(u=>URL.revokeObjectURL(u)),60000);
  const result=volatileResult||pending;
  if(!result) return;
  for(const file of result.files){
    const a=document.createElement('a'),url=URL.createObjectURL(file.blob);
    a.href=url;a.download=file.name;a.textContent=`${file.kind}を保存`;
    box.append(a);downloadURLs.push(url);
  }
  const files=result.files.map(f=>new File([f.blob],f.name,{type:f.blob.type}));
  if(navigator.canShare?.({files})){
    const share=document.createElement('button');share.textContent='まとめて共有';
    share.onclick=()=>navigator.share({files,title:'踏査結果'}).catch(e=>{
      if(e.name!=='AbortError') msg('共有できない場合は各ファイルの保存リンクを使ってください。');
    });
    box.append(share);
  }
  if(volatileResult){
    const retry=document.createElement('button');retry.textContent='端末保存を再試行';
    retry.onclick=()=>commitResult(volatileResult);box.append(retry);
  }else if(pending.index<pending.files.length){
    const send=document.createElement('button');send.textContent='GitHubへ保存／再試行';
    send.onclick=sendPending;box.append(send);
  }
}
async function commitResult(result){
  if(!result||busy) return;
  busy=true;updateControls();
  try{
    await dbWrite(['meta','surveys'],tx=>{
      tx.objectStore('surveys').put(result.history);
      tx.objectStore('meta').put(result,'pending');
      tx.objectStore('meta').delete('draft');
    });
    history=history.filter(h=>h.id!==result.history.id);history.push(result.history);
    selected.add(result.history.id);
    pending=result;volatileResult=null;rebuildHistory();
    $('saveStatus').textContent='今回の結果を端末に保存しました。';
    msg('Excel・KMLの保存リンクからPCへ転送できます。GitHub保存は下のボタンから実行します。');
  }catch(e){
    $('saveStatus').textContent=`端末履歴への保存に失敗：${e.message}`;
    msg('画面を閉じないでください。先にExcel・KMLを保存し、端末保存を再試行してください。');
  }finally{busy=false;updateControls();showDownloads();renderList();}
}
$('finish').onclick=async()=>{
  if(!job||busy) return;
  if(pending&&pending.index<pending.files.length&&
    !confirm('前回のGitHub保存に未送信分があります。今回の結果を確定すると再試行リストは今回分に置き換わります。続けますか？')) return;
  if(!confirm('今回の調査を終了し、Excel・KMLと色塗りを保存しますか？')) return;
  busy=true;updateControls();
  try{
    finishZone();
    const s=job;s.end=Date.now();
    const name=[...new Set(s.points.map(p=>p.route).filter(r=>r!=='路線外'&&r!=='道路判定中'))]
      .slice(0,3).join(' / ')||'路線踏査';
    const record={id:s.id,name,end:s.end,sections:structuredClone(s.sections)};
    const xlsx=new Blob([XLSX.write(workbook(s),{type:'array',bookType:'xlsx'})],{
      type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    const files=[
      {kind:'Excel',name:`踏査結果_${s.id}.xlsx`,blob:xlsx},
      {kind:'KML',name:`踏査軌跡_${s.id}.kml`,blob:makeKml(s)},
      {kind:'車線記録JSON',name:`車線記録_${s.id}.json`,
        blob:new Blob([JSON.stringify(record)],{type:'application/json'})}
    ];
    volatileResult={survey:s,history:record,files,index:0};
    stopGPS();job=null;breakTrack();
    $('roadStatus').textContent='調査終了';$('gpsStatus').textContent='';
  }catch(e){
    if(job) job.end=null;
    msg(`出力を作成できませんでした：${e.message}`);
  }finally{busy=false;updateControls();}
  if(volatileResult) await commitResult(volatileResult);
};

(async()=>{
  try{
    db=await openDB();
    const [savedHistory,draft,savedPending]=await Promise.all([
      dbRead('surveys'),dbRead('meta','draft'),dbRead('meta','pending')
    ]);
    history=savedHistory;pending=savedPending;
    recovered=draft?.job?draft:null;
    if(recovered) $('saveStatus').textContent=`前回の途中記録があります：${when(recovered.saved)}`;
    showDownloads();
    const errors=await loadRoutes();
    ready=true;
    $('roadStatus').textContent='待機中｜調査開始を押してください';
    if(errors.length) msg(`一部のKMLを読み込めませんでした。\n${errors.join('\n')}`);
    updateControls();historyDialog();
  }catch(e){
    $('roadStatus').textContent='起動できませんでした';
    msg(`読み込みエラー：${e.message}`);
  }finally{updateControls();}
})();
</script>
