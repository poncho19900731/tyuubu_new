<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="路線踏査">
<title>路線踏査アプリ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{padding:6px;background:#f4f4f4;border-bottom:1px solid #bbb;max-height:55dvh;overflow:auto}
.row{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.row>button{flex:1;min-width:0}
button{font:inherit;font-size:13px;min-height:38px;padding:4px;color:#222;background:#fff;border:1px solid #aaa;border-radius:5px}
button:disabled{opacity:.4}
button[aria-pressed=true]{background:#2168b8;color:#fff}
.field{flex:0 0 60px;font-size:13px;font-weight:bold}
#start{background:#237842;color:#fff}
#end{background:#bd2525;color:#fff}
#save{background:#315bb4;color:#fff}
#list{background:#6346a4;color:#fff}
#construction{background:#765546;color:#fff}
#detour{background:#935900;color:#fff}
#construction.recording,#detour.recording{background:#bd2525}
#checkpoint{background:#006b70;color:#fff}
#state{background:#fff;border:1px solid #ddd;border-radius:5px;padding:5px;font-size:12px;overflow-wrap:anywhere}
#message{white-space:pre-line}
#draftStatus{color:#075c61}
#tools,#downloads{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
#tools button{min-height:30px;font-size:12px}
#map{flex:1;min-height:0}
#follow{position:fixed;right:10px;bottom:27px;z-index:1000;padding:7px 12px;border-radius:20px}
.dot{background:#d62a2a;border:3px solid white;border-radius:50%;width:20px;height:20px;box-shadow:0 0 0 3px #d62a2a66}
.label{background:#fff;border:3px solid;border-radius:50%;text-align:center;line-height:22px;font-weight:bold}
#panel{position:fixed;inset:auto 0 0;height:48%;z-index:1100;background:#fff;border-top:2px solid #6346a4;padding:5px;display:flex;flex-direction:column}
#tableArea{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border:1px solid #ccc;padding:4px;white-space:nowrap}
th{position:sticky;top:0;background:#f4f4f4}
dialog{border:0;border-radius:8px;max-width:95vw}
dialog input{width:100%;font-size:16px;margin-bottom:8px}
dialog::backdrop{background:#0008}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="header">
  <div class="row">
    <button id="start" disabled>調査開始</button>
    <button id="end" disabled>調査終了</button>
    <button id="checkpoint" disabled>途中保存</button>
  </div>
  <div class="row">
    <button id="list">経路一覧</button>
    <button id="construction" disabled>工事 開始</button>
    <button id="detour" disabled>迂回 開始</button>
  </div>
  <div class="row" id="counts" role="group" aria-label="車線数">
    <span class="field">車線数</span>
    <button data-n="1">片道</button><button data-n="2">2車線</button>
    <button data-n="3">3車線</button><button data-n="4">4車線</button>
    <button data-n="0">未設定</button>
  </div>
  <div class="row" id="lanes" role="group" aria-label="車線番号">
    <span class="field">車線No.</span>
    <button data-n="1">1</button><button data-n="2">2</button>
    <button data-n="3">3</button><button data-n="4">4</button>
  </div>
  <div id="state">
    <div id="info" aria-live="polite">読み込み中…</div>
    <div id="zoneStatus"></div>
    <div id="gpsStatus"></div>
    <div id="draftStatus" aria-live="polite"></div>
    <div id="message" aria-live="polite"></div>
    <div class="row" id="recovery" hidden>
      <button id="resume">前回の調査を再開</button>
      <button id="discard">前回の途中記録を破棄</button>
    </div>
    <div id="tools">
      <button id="save" disabled>記録をGitHubへ保存</button>
      <button id="tokenSettings">トークン設定</button>
      <button id="retryToken" hidden>トークンを再入力</button>
      <button id="retrySave" hidden>保存を再試行</button>
    </div>
    <div id="downloads"></div>
  </div>
</header>
<div id="map"></div>
<button id="follow" aria-pressed="false">現在地追従：OFF</button>
<section id="panel" hidden aria-label="経路一覧">
  <div class="row">
    <span id="listSummary"></span>
    <button id="export">Excel保存</button>
    <button id="clear">記録をクリア</button>
    <button id="closeList">閉じる</button>
  </div>
  <div id="tableArea"></div>
</section>
<dialog id="tokenDialog">
  <form method="dialog">
    <p><label for="pat">GitHubトークン</label></p>
    <input id="pat" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="row">
      <button value="set">登録</button>
      <button value="remove">登録を解除</button>
      <button value="cancel">キャンセル</button>
    </div>
  </form>
</dialog>
<dialog id="reasonDialog">
  <form method="dialog">
    <p>迂回の理由を選択してください</p>
    <div class="row">
      <button value="路駐">路駐</button>
      <button value="工事">工事</button>
      <button value="">キャンセル</button>
    </div>
  </form>
</dialog>

<script>
'use strict';

const OWNER='poncho19900731', REPO='tyuubu_new', BRANCH='main';
const FOLDER='results', PROGRESS='progress.json', LIST='list.json';
const TOKEN_KEY=`road:${OWNER}/${REPO}:token`;
const LEGACY_PROGRESS_KEY='rosen_progress_v1';
const PROGRESS_KEY=`road:${OWNER}/${REPO}:progress`;
const DIRTY_KEY=`${LEGACY_PROGRESS_KEY}:${OWNER}/${REPO}:unsynced`;
const DRAFT_KEY=`${OWNER}/${REPO}/${BRANCH}`;
const UNIT_M=50, NEAR_M=15, ACCURACY_M=25, MIN_MOVE_M=2, JOIN_M=20;
const LABEL_DUP_M=60, LABEL_INTERVAL_M=1000, GAP_UNITS=3, MAX_GAP_MS=20000;
const COLORS=['#237f35','#405cdd','#e6194b','#ed7822','#911eb4','#008b8b','#9a6324',
  '#d2007a','#808000','#000075','#46a0f0','#f032e6','#7fb800','#800000','#555555'];
const TYPES={
  construction:{name:'工事',color:'#8d6e63',kml:'ff636e8d'},
  detour:{name:'迂回',color:'#ffb347',kml:'ff47b3ff'}
};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const pad=n=>String(n).padStart(2,'0');
const date=d=>`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
const time=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const dt=d=>`${date(d)} ${time(d)}`;
const stamp=d=>date(d).replace(/\//g,'')+'_'+time(d).replace(/:/g,'');
const xy=p=>[p.lng,p.lat], ll=c=>[c[1],c[0]];
const dist=(a,b)=>turf.distance(a,b,{units:'meters'});
const near=(line,p)=>turf.nearestPointOnLine(line,p,{units:'meters'}).properties;
const ends=c=>[c[0],c[c.length-1]];
const num=n=>Number(n.toFixed(7));
const stripBom=s=>s.replace(/^\uFEFF/,'');
function read(k){try{return localStorage.getItem(k);}catch{return null;}}
function write(k,v){try{localStorage.setItem(k,v);return true;}catch{return false;}}
function remove(k){try{localStorage.removeItem(k);}catch{}}
function msg(s){$('message').textContent=s;}

let segments=[],runs=[],points=[],zones=[];
let run=null,activeZone=null,latest=null,previous=new Map();
let laneCount=0,laneNo=0,follow=false,marker=null,watchId=null,wakeLock=null;
let ready=false,saving=false,ending=false,recoveryBusy=false;
let revision=0,pending=null,recovered=null,dirtyDraft=false;
let token=read(TOKEN_KEY)||'';

const map=L.map('map').setView([24.78,125.33],11);
for(const [name,z] of Object.entries({
  roads:400,done:430,tracks:460,laneEdge:470,laneFill:471,zones:480,labels:500,current:570
})) map.createPane(name).style.zIndex=z;
const gsi=(name,ext='png')=>L.tileLayer(
  `https://cyberjapandata.gsi.go.jp/xyz/${name}/{z}/{x}/{y}.${ext}`,
  {attribution:'地理院タイル',maxZoom:18}
);
const bases={
  '淡色地図':gsi('pale'),'標準地図':gsi('std'),'航空写真':gsi('seamlessphoto','jpg'),
  'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap contributors',maxZoom:19})
};
bases['淡色地図'].addTo(map);
L.control.layers(bases).addTo(map);
const tracks=L.layerGroup().addTo(map),zoneLayer=L.layerGroup().addTo(map);
if(window.ResizeObserver) new ResizeObserver(()=>map.invalidateSize()).observe($('header'));
window.addEventListener('resize',()=>map.invalidateSize());

function stats(){
  const out=new Map();
  for(const s of segments){
    if(!out.has(s.route)) out.set(s.route,{total:0,done:0,touched:0});
    const r=out.get(s.route);
    r.total++;
    if(s.units.size===s.count) r.done++;
    if(s.units.size) r.touched++;
  }
  return out;
}
function info(){
  const st=stats();
  const full=[...st.values()].filter(r=>r.total===r.done).length;
  const checked=segments.reduce((n,s)=>n+s.units.size,0);
  const total=segments.reduce((n,s)=>n+s.count,0);
  $('info').textContent=`${run?'調査中':'待機中'}｜路線 ${st.size} 本｜全線踏査済み ${full} 本｜小区間 ${checked}/${total}`;
}
function controls(){
  const busy=saving||ending||recoveryBusy;
  $('start').disabled=!ready||!!run||busy||!!pending||!!recovered;
  $('end').disabled=!run||busy||!!pending;
  $('checkpoint').disabled=!run||busy;
  $('save').disabled=!ready||busy||!!recovered;
  $('tokenSettings').disabled=busy;
  $('retryToken').hidden=!pending||!pending.auth;
  $('retrySave').hidden=!pending||!!pending.auth;
  $('retryToken').disabled=busy;
  $('retrySave').disabled=busy;
  $('recovery').hidden=!recovered;
  $('resume').disabled=busy;
  $('discard').disabled=busy;
  for(const [key,t] of Object.entries(TYPES)){
    const on=activeZone?.type===key;
    $(key).textContent=`${t.name} ${on?'終了':'開始'}`;
    $(key).classList.toggle('recording',on);
    $(key).disabled=!run||busy||(!!activeZone&&!on);
  }
}
function showLanes(){
  for(const b of $('counts').querySelectorAll('button')){
    b.setAttribute('aria-pressed',String(+b.dataset.n===laneCount));
  }
  for(const b of $('lanes').querySelectorAll('button')){
    const n=+b.dataset.n;
    b.disabled=laneCount===1?n!==1:n>laneCount;
    b.setAttribute('aria-pressed',String(n===laneNo));
  }
}
$('counts').onclick=e=>{
  const b=e.target.closest('button[data-n]');
  if(!b||ending||recovered) return;
  laneCount=+b.dataset.n;
  if(laneCount===1) laneNo=1;
  else if(laneNo>laneCount) laneNo=0;
  if(run&&laneCount!==1) run.white=null;
  showLanes();
  if(run) saveDraft();
};
$('lanes').onclick=e=>{
  const b=e.target.closest('button[data-n]');
  if(!b||b.disabled||laneCount===1||ending||recovered) return;
  laneNo=laneNo===+b.dataset.n?0:+b.dataset.n;
  showLanes();
  if(run) saveDraft();
};
showLanes();

function parseKml(text){
  const xml=new DOMParser().parseFromString(stripBom(text),'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('KML形式が不正です');
  const items=[];
  toGeoJSON.kml(xml).features.forEach((f,i)=>{
    const g=f.geometry;
    const name=String(f.properties?.name||'')
      .replace(/（way\s*\d+）|\(way\s*\d+\)/g,'')
      .replace(/_\d+\s*$/,'').trim()||`路線_${i+1}`;
    const lines=g?.type==='LineString'?[g.coordinates]:
      g?.type==='MultiLineString'?g.coordinates:[];
    for(const c of lines) if(c.length>=2) items.push([name,c]);
  });
  return items;
}
function joinParts(parts){
  const pool=parts.map(c=>c.slice());
  let line=pool.shift();
  while(pool.length){
    const [a,b]=ends(line);
    let found=false;
    for(let i=0;i<pool.length;i++){
      const p=pool[i],[c,d]=ends(p);
      let m;
      if(dist(b,c)<=JOIN_M) m=line.concat(p.slice(1));
      else if(dist(b,d)<=JOIN_M) m=line.concat(p.slice(0,-1).reverse());
      else if(dist(a,d)<=JOIN_M) m=p.concat(line.slice(1));
      else if(dist(a,c)<=JOIN_M) m=p.slice().reverse().concat(line.slice(1));
      if(m){line=m;pool.splice(i,1);found=true;break;}
    }
    if(!found) break;
  }
  return [line,...pool];
}
function drawRoutes(groups){
  const routeLayers=[],labels=[],assigned=[];
  for(const [route] of groups){
    const parts=segments.filter(s=>s.route===route);
    const used=new Set();
    for(const other of assigned){
      if(parts.some(s=>other.parts.some(t=>
        ends(s.coords).some(p=>near(t.line,p).dist<=30)||
        ends(t.coords).some(p=>near(s.line,p).dist<=30)))) used.add(other.color);
    }
    const color=COLORS.find(c=>!used.has(c))||COLORS[assigned.length%COLORS.length];
    assigned.push({parts,color});
    for(const s of parts){
      s.color=color;
      routeLayers.push(L.polyline(s.coords.map(ll),{
        pane:'roads',color,weight:6,opacity:.8,interactive:false
      }).addTo(map));
      const [a,b]=ends(s.coords);
      labels.push({s,p:a,end:true},{s,p:b,end:true});
      const n=Math.max(1,Math.round(s.length/LABEL_INTERVAL_M)-1);
      for(let i=1;i<=n;i++) labels.push({s,end:false,
        p:turf.along(s.line,s.length*i/(n+1),{units:'meters'}).geometry.coordinates});
    }
  }
  const kept=[];
  labels.sort((a,b)=>Number(b.end)-Number(a.end));
  for(const x of labels){
    if(kept.some(k=>k.s.route===x.s.route&&dist(k.p,x.p)<=LABEL_DUP_M)) continue;
    kept.push(x);
    const label=x.s.route.match(/\d+/)?.[0]||x.s.route.slice(0,2);
    L.marker(ll(x.p),{pane:'labels',interactive:false,icon:L.divIcon({
      className:'',iconSize:[28,28],
      html:`<div class="label" style="border-color:${x.s.color}">${esc(label)}</div>`
    })}).addTo(map);
  }
  map.fitBounds(L.featureGroup(routeLayers).getBounds(),{maxZoom:17});
}
async function getText(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.text();
}
async function loadRoutes(){
  const files=JSON.parse(stripBom(await getText(LIST)));
  if(!Array.isArray(files)||!files.length) throw new Error('list.json にKMLがありません');
  const groups=new Map(),errors=[];
  for(let i=0;i<files.length;i++){
    const file=files[i];
    $('info').textContent=`路線読み込み中… ${i+1}/${files.length}`;
    try{
      if(typeof file!=='string'||!file) throw new Error('ファイル名が不正です');
      const path=file.split('/').map(encodeURIComponent).join('/');
      const items=parseKml(await getText(path));
      if(!items.length) throw new Error('路線の線がありません');
      for(const [route,coords] of items){
        if(!groups.has(route)) groups.set(route,{parts:[],files:new Set()});
        const g=groups.get(route);
        g.parts.push(coords);
        g.files.add(file);
      }
    }catch(e){errors.push(`${file}：${e.message}`);}
  }
  for(const [route,g] of groups){
    const parts=joinParts(g.parts);
    parts.forEach((coords,i)=>{
      const line=turf.lineString(coords),length=turf.length(line,{units:'meters'});
      if(!(length>0)) return;
      segments.push({route,id:parts.length>1?`${route}_${i+1}`:route,
        files:[...g.files].join(' / '),coords,line,length,
        count:Math.ceil(length/UNIT_M),bbox:turf.bbox(line),units:new Map()});
    });
  }
  if(!segments.length) throw new Error(`路線を表示できません。\n${errors.join('\n')}`);
  drawRoutes(groups);
  if(errors.length) msg(`読み込めなかったKML：\n${errors.join('\n')}`);
}

function progressData(){
  return Object.fromEntries(segments.filter(s=>s.units.size).map(s=>[
    s.id,{count:s.count,units:[...s.units.keys()].sort((a,b)=>a-b)}
  ]));
}
function persist(){
  revision++;
  write(PROGRESS_KEY,JSON.stringify(progressData()));
  write(DIRTY_KEY,'1');
  if(run) dirtyDraft=true;
}
function mark(s,i){
  if(!Number.isInteger(i)||i<0||i>=s.count||s.units.has(i)) return false;
  const part=turf.lineSliceAlong(s.line,i*UNIT_M/1000,
    Math.min(s.length,(i+1)*UNIT_M)/1000,{units:'kilometers'});
  const line=L.polyline(part.geometry.coordinates.map(ll),{
    pane:'done',color:s.color,weight:9,opacity:1
  }).addTo(map);
  s.units.set(i,line);
  line.on('click',()=>{
    if(saving||ending||pending||recovered||
       !confirm('ここにつながる踏査済み部分を未踏査に戻しますか？')) return;
    let a=i,b=i;
    while(s.units.has(a-1)) a--;
    while(s.units.has(b+1)) b++;
    for(let k=a;k<=b;k++){s.units.get(k).remove();s.units.delete(k);}
    previous.clear();
    persist();
    if(run) saveDraft();
    info();
  });
  return true;
}
function applyProgress(data){
  for(const s of segments){
    const entry=Object.prototype.hasOwnProperty.call(data,s.id)?data[s.id]:null;
    const keep=new Set(entry?.count===s.count&&Array.isArray(entry.units)?entry.units:[]);
    for(const [i,line] of s.units){
      if(!keep.has(i)){line.remove();s.units.delete(i);}
    }
    for(const i of keep) mark(s,i);
  }
}
async function restoreProgress(draft){
  let data={};
  try{data=JSON.parse(read(PROGRESS_KEY)||read(LEGACY_PROGRESS_KEY)||'{}')||{};}catch{}
  if(draft?.progress){
    // 未同期の端末進捗があれば優先。なければ途中保存時点の進捗を使う。
    if(read(DIRTY_KEY)!=='1'||!read(PROGRESS_KEY)) data=draft.progress;
  }else if(read(DIRTY_KEY)!=='1'){
    try{
      const raw=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FOLDER}/${PROGRESS}`;
      const remote=JSON.parse(await getText(raw));
      if(remote&&typeof remote==='object'&&!Array.isArray(remote)){
        data=remote;
        write(PROGRESS_KEY,JSON.stringify(data));
      }
    }catch{}
  }
  applyProgress(data);
}

$('follow').onclick=()=>{
  follow=!follow;
  $('follow').textContent=`現在地追従：${follow?'ON':'OFF'}`;
  $('follow').setAttribute('aria-pressed',String(follow));
  if(follow&&marker) map.panTo(marker.getLatLng());
};
function breakContinuity(){
  previous.clear();
  latest=null;
  if(run){run.track=null;run.white=null;}
  if(activeZone) activeZone.newPath=true;
}
function watch(){
  if(watchId!==null) return;
  if(!navigator.geolocation){
    $('gpsStatus').textContent='この端末は位置情報取得に対応していません。';
    return;
  }
  watchId=navigator.geolocation.watchPosition(onPosition,e=>{
    $('gpsStatus').textContent=`位置情報：${e.message}`;
    breakContinuity();
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
async function lock(){
  if(!run||document.hidden||!navigator.wakeLock||(wakeLock&&!wakeLock.released)) return;
  const target=run;
  try{
    const l=await navigator.wakeLock.request('screen');
    if(run!==target||document.hidden||(wakeLock&&!wakeLock.released)) await l.release();
    else wakeLock=l;
  }catch{}
}
function locate(p){
  const dy=NEAR_M*1.5/111000,dx=dy/Math.max(.2,Math.cos(p.lat*Math.PI/180));
  const hits=[];
  for(const s of segments){
    const [a,b,c,d]=s.bbox;
    if(p.lng<a-dx||p.lng>c+dx||p.lat<b-dy||p.lat>d+dy) continue;
    const hit=near(s.line,xy(p));
    if(hit.dist<=NEAR_M) hits.push({s,hit});
  }
  return hits.sort((a,b)=>a.hit.dist-b.hit.dist);
}
function newWhite(){
  const base={interactive:false,lineCap:'round',lineJoin:'round'};
  return {
    edge:L.polyline([],{...base,pane:'laneEdge',color:'#fff',weight:10}).addTo(tracks),
    fill:L.polyline([],{...base,pane:'laneFill',color:'#303640',weight:5}).addTo(tracks)
  };
}
function trackLayer(latlngs=[]){
  return L.polyline(latlngs,{
    pane:'tracks',color:'#222',weight:4,opacity:.85,interactive:false
  }).addTo(tracks);
}
function drawTrack(r,p){
  if(!r.track){
    const coords=[];
    r.paths.push(coords);
    r.track={coords,line:trackLayer()};
  }
  r.track.coords.push(xy(p));
  r.track.line.addLatLng(ll(xy(p)));
  if(p.laneCount!==1){r.white=null;return;}
  if(!r.white) r.white=newWhite();
  r.white.edge.addLatLng(ll(xy(p)));
  r.white.fill.addLatLng(ll(xy(p)));
}
function addZonePoint(p){
  const z=activeZone;
  if(!z) return;
  if(z.newPath||!z.paths.length){z.paths.push([]);z.newPath=false;}
  const path=z.paths[z.paths.length-1],c=xy(p),last=path[path.length-1];
  if(!last||c[0]!==last[0]||c[1]!==last[1]) path.push(c);
  z.last=p;
  dirtyDraft=true;
}
function onPosition(pos){
  const {latitude:lat,longitude:lng,accuracy}=pos.coords;
  if(!marker){
    marker=L.marker([lat,lng],{pane:'current',interactive:false,icon:L.divIcon({
      className:'',html:'<div class="dot"></div>',iconSize:[20,20],iconAnchor:[10,10]
    })}).addTo(map);
  }else marker.setLatLng([lat,lng]);
  if(follow) map.panTo([lat,lng]);
  if(!Number.isFinite(accuracy)||accuracy>ACCURACY_M){
    $('gpsStatus').textContent='GPS精度が低いため、踏査記録を一時停止しています。';
    breakContinuity();
    return;
  }
  $('gpsStatus').textContent='';
  if(!run||ending||document.hidden||pos.timestamp<run.acceptAfter) return;
  if(latest&&pos.timestamp<=latest.time.getTime()) return;
  if(latest&&pos.timestamp-latest.time.getTime()>MAX_GAP_MS) breakContinuity();

  const p={lat,lng,accuracy,time:new Date(pos.timestamp),laneCount,laneNo};
  const hits=locate(p);
  p.route=[...new Set(hits.map(h=>h.s.route))].join(' / ')||'路線外';
  latest=p;
  const last=run.points[run.points.length-1];
  if(!run.track||!last||last.laneCount!==p.laneCount||last.laneNo!==p.laneNo||
     last.route!==p.route||dist(xy(last),xy(p))>=MIN_MOVE_M){
    run.points.push(p);
    points.push(p);
    drawTrack(run,p);
    dirtyDraft=true;
    if(activeZone) addZonePoint(p);
    renderList();
  }
  if(activeZone) activeZone.last=p;
  else{
    const nearby=zones.filter(z=>z.paths.some(path=>path.length===1
      ?dist(path[0],xy(p))<=NEAR_M
      :near(turf.lineString(path),xy(p)).dist<=NEAR_M));
    $('zoneStatus').textContent=nearby.length
      ?'現在地：'+[...new Set(nearby.map(zoneName))].join(' / '):'';
  }

  const next=new Map();
  let changed=false;
  if(hits.length){
    const {s,hit}=hits[0];
    if(Number.isFinite(hit.location)){
      const i=Math.max(0,Math.min(s.count-1,Math.floor(hit.location/UNIT_M)));
      const prev=previous.get(s),elapsed=prev?p.time-prev.time:0;
      if(prev&&elapsed>0&&elapsed<=MAX_GAP_MS&&Math.abs(i-prev.i)<=GAP_UNITS){
        for(let k=Math.min(i,prev.i);k<=Math.max(i,prev.i);k++){
          if(mark(s,k)) changed=true;
        }
      }
      next.set(s,{i,time:p.time});
    }
  }
  previous=next;
  if(changed) persist();
  info();
}
$('start').onclick=()=>{
  if(!ready||run||pending||recovered||saving||ending||!navigator.geolocation) return;
  const start=new Date();
  run={start,end:null,points:[],paths:[],track:null,white:null,acceptAfter:start.getTime()};
  runs.push(run);
  latest=null;
  previous.clear();

};

function choose(dialog){

function zoneName(z){return z.type==='construction'?'工事':`迂回（${z.reason}）`;}
function drawZone(z){
  const type=TYPES[z.type];
  for(const path of z.paths){
    const layer=path.length===1
      ?L.circleMarker(ll(path[0]),{pane:'zones',radius:7,color:'#333',fillColor:type.color,fillOpacity:1})
      :L.polyline(path.map(ll),{pane:'zones',color:type.color,weight:7});
    layer.bindPopup(`<strong>${esc(zoneName(z))}</strong><br>`+
      `開始 ${dt(z.start.time)}<br>終了 ${dt(z.end.time)}`).addTo(zoneLayer);
  }
}
async function toggleZone(type){
  if(!run||saving||ending) return;
  if(activeZone){
    if(activeZone.type===type){finishZone();saveDraft();}
    return;
  }
  if(!latest){alert('有効な現在地を取得してから押してください。');return;}
  const target=run;
  const reason=type==='detour'?await choose($('reasonDialog')):'';
  if(run!==target||activeZone||ending||(type==='detour'&&!reason)) return;
  if(!latest){alert('現在地を再取得してから押してください。');return;}
  activeZone={type,reason,start:latest,last:latest,paths:[[xy(latest)]],newPath:false};
  $('zoneStatus').textContent=`${TYPES[type].name} 記録中`;
  controls();
  saveDraft();
}
function finishZone(){
  if(!activeZone) return;
  const a=activeZone;
  if(!a.newPath) addZonePoint(a.last);
  const z={type:a.type,reason:a.reason,start:a.start,end:a.last,paths:a.paths};
  zones.push(z);
  drawZone(z);
  activeZone=null;
  $('zoneStatus').textContent='';
  controls();renderList();
}

function makeExcel(r,kmlName,xlsxName){

    ['今回の測位記録数',r.points.length],['経路一覧の累計記録数',points.length],
    ['全線を踏査済みの路線',full.join(' / ')||'なし'],

    ['迂回区間の数（累計）',zones.filter(z=>z.type==='detour').length]

  sheet(wb,'路線別結果',[

    ...segments.map(s=>{
      const n=s.units.size;
      return [s.route,s.id,s.files,Math.round(s.length),s.count,n,
        n===s.count?100:Math.min(99,Math.round(n*100/s.count)),
        n===s.count?'踏査済み':n?'一部踏査':'未踏査'];
    })
  ],[24,30,28,12,12,16,12,12]);
  logSheets(wb);
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{
    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
}
function makeKml(r){
  function item(name,coords,color,desc){
    if(!coords.length) return '';
    const c=coords.map(([x,y])=>`${x},${y},0`).join(' ');
    const geom=coords.length===1?`<Point><coordinates>${c}</coordinates></Point>`:
      `<LineString><tessellate>1</tessellate><coordinates>${c}</coordinates></LineString>`;
    return `<Placemark><name>${esc(name)}</name><description>${esc(desc)}</description>`+
      `<Style><LineStyle><color>${color}</color><width>5</width></LineStyle></Style>${geom}</Placemark>`;
  }
  const paths=runs.flatMap((a,i)=>a.paths.map((p,j)=>
    item(`踏査軌跡_${i+1}_${j+1}`,p,'ff222222',
      `開始 ${dt(a.start)} / 終了 ${dt(a.end||r.end)}`)));
  const zoneMarks=zones.flatMap((z,i)=>z.paths.map((p,j)=>
    item(`${zoneName(z)}_${i+1}_${j+1}`,p,TYPES[z.type].kml,
      `開始 ${dt(z.start.time)} / 終了 ${dt(z.end.time)}`)));
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n',
    '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>',
    `<name>踏査軌跡_${stamp(r.start)}</name>`,...paths,...zoneMarks,'</Document></kml>'],
    {type:'application/vnd.google-earth.kml+xml'});
}

// ===== iPhone内への途中保存（IndexedDB） =====
let dbPromise=null,dbQueue=Promise.resolve();
function openDb(){
  if(!dbPromise){
    dbPromise=new Promise((resolve,reject)=>{
      const req=indexedDB.open('road-survey-drafts-v1',1);
      req.onupgradeneeded=()=>{
        if(!req.result.objectStoreNames.contains('drafts')) req.result.createObjectStore('drafts');
      };
      req.onsuccess=()=>{
        const db=req.result;
        db.onversionchange=()=>{db.close();dbPromise=null;};
        resolve(db);
      };
      req.onerror=()=>reject(req.error);
      req.onblocked=()=>reject(new Error('別の画面で端末保存領域を使用しています'));
    }).catch(e=>{dbPromise=null;throw e;});
  }
  return dbPromise;
}
async function draftTx(mode,action){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('drafts',mode);
    const req=action(tx.objectStore('drafts'));
    tx.oncomplete=()=>resolve(req.result);
    tx.onabort=()=>reject(tx.error||new Error('端末保存を完了できませんでした'));
  });
}
function queueDb(action){
  const next=dbQueue.then(()=>draftTx('readwrite',action));
  dbQueue=next.catch(()=>{});
  return next;
}
function fileJob(job){return !!job?.items.some(i=>!i.update);}
function captureDraft(){
  return {
    version:2,savedAt:Date.now(),
    phase:fileJob(pending)?'upload':'survey',
    laneCount,laneNo,revision,progress:progressData(),
    runs:runs.map(r=>({start:r.start,end:r.end,points:r.points,paths:r.paths})),
    zones,active:run?runs.indexOf(run):-1,activeZone,
    job:fileJob(pending)?{items:pending.items,index:pending.index}:null
  };
}
function saveDraft(manual=false){
  if(!run&&!fileJob(pending)) return Promise.resolve(false);
  let snapshot;
  try{snapshot=structuredClone(captureDraft());}
  catch{
    dirtyDraft=true;
    $('draftStatus').textContent='途中記録を保存できませんでした。画面を閉じないでください。';
    return Promise.resolve(false);
  }
  dirtyDraft=false;
  return queueDb(store=>store.put(snapshot,DRAFT_KEY)).then(()=>{
    $('draftStatus').textContent=
      `${manual?'途中保存':snapshot.phase==='upload'?'保存待ちデータの端末保存':'自動保存'}済み：${time(new Date(snapshot.savedAt))}`;
    return true;
  }).catch(()=>{
    dirtyDraft=true;
    $('draftStatus').textContent='端末への保存に失敗しました。画面を閉じず、もう一度お試しください。';
    return false;
  });
}
function deleteDraft(){return queueDb(store=>store.delete(DRAFT_KEY));}
function restoreDraftData(d){
  laneCount=d.laneCount;
  laneNo=d.laneNo;
  revision=d.revision||0;
  runs=d.runs.map(r=>({...r,track:null,white:null,acceptAfter:Date.now()}));
  points=runs.flatMap(r=>r.points);
  zones=d.zones;
  run=d.active>=0?runs[d.active]:null;
  activeZone=run?d.activeZone:null;
  breakContinuity();
  tracks.clearLayers();zoneLayer.clearLayers();
  for(const r of runs){
    let offset=0;
    for(const path of r.paths){
      trackLayer(path.map(ll));
      let white=null;
      for(let i=0;i<path.length;i++){
        if(r.points[offset+i]?.laneCount===1){
          if(!white) white=newWhite();
          white.edge.addLatLng(ll(path[i]));
          white.fill.addLatLng(ll(path[i]));
        }else white=null;
      }
      offset+=path.length;
    }
  }
  for(const z of zones) drawZone(z);
  $('zoneStatus').textContent=activeZone?`${TYPES[activeZone.type].name} 記録中（再開）`:'';
  showLanes();info();renderList();
}
$('checkpoint').onclick=()=>saveDraft(true);
$('resume').onclick=()=>{
  if(!recovered||recoveryBusy) return;
  const d=recovered;
  restoreDraftData(d);
  recovered=null;
  $('draftStatus').textContent='前回の調査を再開しました。次の測位から新しい線で記録します。';
  controls();watch();lock();
};
$('discard').onclick=async()=>{
  if(!recovered||recoveryBusy||
    !confirm('前回の途中記録を破棄しますか？ 踏査済みの進捗は残します。')) return;
  recoveryBusy=true;controls();
  try{
    const data=JSON.stringify(progressData());
    const progressStored=write(PROGRESS_KEY,data);
    const dirtyStored=write(DIRTY_KEY,'1');
    if(!progressStored||!dirtyStored) throw new Error('踏査進捗を端末に保持できませんでした');
    await deleteDraft();
    recovered=null;
    $('draftStatus').textContent='前回の途中記録を破棄しました。';
  }catch(e){$('draftStatus').textContent=`途中記録を破棄できませんでした：${e.message}`;}
  finally{recoveryBusy=false;controls();}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    breakContinuity();

    }
    watch();lock();
  }
});
window.addEventListener('pagehide',()=>{

setInterval(()=>{

// ===== GitHubへの保存 =====
function progressItem(){
  return {name:PROGRESS,update:true,rev:revision,blob:new Blob(
    [JSON.stringify(progressData())],{type:'application/json'})};
}
function base64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]);
    reader.onerror=()=>reject(new Error('ファイルを変換できませんでした'));
    reader.readAsDataURL(blob);
  });
}
async function check(res,name){
  if(res.ok) return;
  const detail=await res.json().catch(()=>({}));
  const e=new Error(`${name}：HTTP ${res.status} ${detail.message||''}`);
  e.status=res.status;
  throw e;
}
async function upload(item,pat){
  const path=`${FOLDER}/${item.name}`.split('/').map(encodeURIComponent).join('/');
  const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const headers={Authorization:`Bearer ${pat}`,Accept:'application/vnd.github+json',
    'Content-Type':'application/json'};
  const body={message:`踏査記録：${item.name}`,branch:BRANCH,content:await base64(item.blob)};
  const old=await fetch(`${url}?ref=${encodeURIComponent(BRANCH)}`,{headers,cache:'no-store'});
  if(old.ok){
    const meta=await old.json();
    if(item.update) body.sha=meta.sha;
    else{
      // 送信成功直後に画面が閉じた場合は、同じ内容なら送信済みとして扱う。
      if(meta.encoding==='base64'&&typeof meta.content==='string'&&
         meta.content.replace(/\s/g,'')===body.content) return;
      // 大きな出力は JSON に内容が載らない場合があるため raw で照合する。
      if(meta.size===item.blob.size){
        const raw=await fetch(`${url}?ref=${encodeURIComponent(BRANCH)}`,{
          headers:{Authorization:`Bearer ${pat}`,Accept:'application/vnd.github.raw+json'},
          cache:'no-store'
        });
        await check(raw,item.name);
        if(await base64(await raw.blob())===body.content) return;
      }
      throw new Error(`${item.name}：同名で内容が異なるファイルがあります。端末保存をご利用ください。`);
    }
  }else if(old.status!==404) await check(old,item.name);
  await check(await fetch(url,{method:'PUT',headers,body:JSON.stringify(body)}),item.name);
}
function makeJob(items,index=0){
  return {items,index,auth:!token,urls:[]};
}
function clearDownloads(job){
  $('downloads').replaceChildren();
  for(const url of job.urls) setTimeout(()=>URL.revokeObjectURL(url),60000);
  job.urls=[];
}
function offerDownloads(job){
  clearDownloads(job);
  const files=job.items.filter(i=>!i.update);
  if(!files.length) return;
  for(const item of files){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(item.blob);
    a.download=item.name;
    a.textContent=`端末保存：${item.name.endsWith('.xlsx')?'Excel':'KML'}`;
    $('downloads').append(a);
    job.urls.push(a.href);
  }
  const b=document.createElement('button');
  b.textContent='端末保存で終了';
  b.onclick=async()=>{
    if(saving||ending||pending!==job) return;
    if(!confirm('ExcelとKMLを端末に保存済みですか？ OKを押すとGitHubへの未完了分は送信しません。')) return;
    saving=true;controls();
    try{await finishJob(job,'GitHubへの再試行を終了しました。');}
    finally{saving=false;controls();}
  };
  $('downloads').append(b);
}
async function finishJob(job,text){
  if(pending!==job) return;
  if(fileJob(job)){
    try{await deleteDraft();}
    catch{
      msg(`${text}\n端末の保存待ち記録を削除できませんでした。`);
      $('draftStatus').textContent='保存待ち記録が端末に残っています。';
      pending=null;
      clearDownloads(job);
      return;
    }
    $('draftStatus').textContent='';
  }
  pending=null;
  clearDownloads(job);
  msg(text);
}
async function processJob(){
  const job=pending;
  if(!job||saving||ending) return;
  if(!token){
    job.auth=true;
    msg('GitHubトークンが未登録です。「トークンを再入力」から登録してください。');
    controls();
    return;
  }
  saving=true;
  job.auth=false;
  controls();
  let backupOK=true;
  try{
    while(job.index<job.items.length){
      const item=job.items[job.index];
      msg(`GitHubへ保存中：${job.index+1}/${job.items.length}\n${item.name}`);
      await upload(item,token);
      if(item.update&&item.rev===revision) write(DIRTY_KEY,'0');
      job.index++;
      if(fileJob(job)) backupOK=await saveDraft();
    }
    await finishJob(job,`GitHubに保存しました（${REPO}/${FOLDER}）。`);
  }catch(e){
    if(e.status===401){
      token='';remove(TOKEN_KEY);job.auth=true;
      msg('トークンが無効か期限切れです。「トークンを再入力」で保存を再開できます。');
    }else if(e.status===403||e.status===404){
      job.auth=true;
      msg('対象リポジトリと Contents の書き込み権限を確認し、トークンを再入力してください。\n'+e.message);
    }else{
      msg('保存が完了しませんでした。「保存を再試行」で再開できます。\n'+e.message);
    }
    if(!backupOK) $('message').textContent+='\n画面を閉じる前に、Excel・KMLを端末にも保存してください。';
  }finally{saving=false;controls();}
}
async function editToken(){
  if(saving||ending||$('tokenDialog').open) return;
  $('pat').value='';
  const action=await choose($('tokenDialog'));
  const value=$('pat').value.trim();
  $('pat').value='';
  if(action==='remove'){
    token='';remove(TOKEN_KEY);
    if(pending) pending.auth=true;
    msg('トークンの登録を解除しました。');
    controls();
    return;
  }
  if(action!=='set') return;
  if(!value){msg('トークンが空です。もう一度入力してください。');return;}
  token=value;
  const stored=write(TOKEN_KEY,token);
  if(pending){
    await processJob();
    if(!stored) $('message').textContent+='\n端末に記憶できないため、次回は再登録が必要です。';
  }else{
    msg(stored?'トークンを登録しました。':
      'このページでは保存に使えますが、端末に記憶できませんでした。');
  }
}
$('tokenSettings').onclick=editToken;
$('retryToken').onclick=editToken;
$('retrySave').onclick=processJob;
$('save').onclick=()=>{
  if(saving||ending||!ready||recovered) return;
  if(!pending) pending=makeJob([progressItem()]);
  processJob();
};
$('end').onclick=async()=>{
  if(!run||saving||ending||pending) return;
  if(!confirm('調査を終了し、Excel・KML・踏査進捗を保存しますか？')) return;
  ending=true;
  controls();
  const finished=run;
  try{
    if(activeZone) finishZone();
    finished.end=new Date();
    const id=`${stamp(finished.start)}_${Math.random().toString(36).slice(2,8)}`;
    const kmlName=`踏査軌跡_${id}.kml`,xlsxName=`踏査結果_${id}.xlsx`;
    const items=[
      {name:kmlName,blob:makeKml(finished)},
      {name:xlsxName,blob:makeExcel(finished,kmlName,xlsxName)},
      progressItem()
    ];
    pending=makeJob(items);
    run=null;
    breakContinuity();
    if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}
    $('zoneStatus').textContent='';
    offerDownloads(pending);
    info();renderList();
    const stored=await saveDraft();
    if(!stored){
      msg('保存待ちデータを端末に記録できませんでした。画面を閉じる前にExcelとKMLを端末に保存してください。「保存を再試行」でもGitHubへ送信できます。');
      return;
    }
  }catch(e){
    if(run===finished) finished.end=null;
    msg(`出力または保存準備に失敗しました：${e.message}`);
    if(run===finished) saveDraft();
    return;
  }finally{ending=false;controls();}
  processJob();
};

controls();
watch();
(async()=>{
  let draft=null;
  try{
    const d=await draftTx('readonly',store=>store.get(DRAFT_KEY));
    if(d?.version===2) draft=d;
  }catch{
    $('draftStatus').textContent='端末の途中記録を読み込めませんでした。';
  }
  // 路線が読み込めない場合でも、出力済みのExcel・KMLは取り出せるようにする。
  if(draft?.phase==='upload'&&draft.job){
    pending=makeJob(draft.job.items,Math.min(draft.job.index,draft.job.items.length));
    offerDownloads(pending);
    controls();
  }
  try{
    await loadRoutes();
    await restoreProgress(draft);
    if(draft?.phase==='upload'&&pending){
      restoreDraftData(draft);
      msg(token?'前回の保存待ち記録を復元しました。「保存を再試行」を押してください。':
        '前回の保存待ち記録を復元しました。「トークンを再入力」を押してください。');
    }else if(draft?.phase==='survey'&&draft.active>=0){
      recovered=draft;
      $('draftStatus').textContent=`前回の途中記録があります（${dt(new Date(draft.savedAt))}）。`;
    }
    ready=true;
    info();
  }catch(e){
    $('info').textContent=`読み込みエラー：${e.message}`;
    if(pending) msg('前回の保存待ちファイルは、端末保存またはGitHubへの再試行ができます。');
  }finally{controls();}
})();
</script>
